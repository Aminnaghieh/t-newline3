[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "liara-agent"
version = "1.0.0"
description = "🛡️ Intelligent SRE Agent for Liara PaaS — Deploy, Monitor, Debug, and Scale with AI-powered insights"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Amin", email = "amin@example.com" }]
keywords = ["liara", "sre", "devops", "agent", "ai", "paas", "deployment"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
    "Topic :: Software Development :: Build Tools",
]

dependencies = [
    "httpx>=0.27,<1.0",
    "pydantic>=2.5,<3.0",
    "pydantic-settings>=2.1,<3.0",
    "rich>=13.7,<14.0",
    "typer>=0.12,<1.0",
    "openai>=1.40,<2.0",
    "websockets>=13.0,<20.0",
    "keyring>=25.0,<26.0",
    "python-dotenv>=1.0,<2.0",
    "aiosqlite>=0.20,<1.0",
    "tenacity>=8.2,<10.0",
    "jinja2>=3.1,<4.0",
    "mcp>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
]

[project.scripts]
liara-agent = "liara_agent.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/liara_agent"]

[tool.hatch.build.targets.sdist]
include = ["src/liara_agent"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
